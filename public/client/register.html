<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Register | QuizHub</title>

	<link rel="stylesheet" href="../css/style.css">

	<link rel="preconnect" href="https://fonts.googleapis.com">

	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link
		href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
		rel="stylesheet">
</head>


<body class="auth-page">

	<main class="auth-card">

		<a href="index.html" class="auth-close" aria-label="Back to homepage">
			×
		</a>

		<p class="auth-label">
			QuizHub
		</p>

		<h1>
			Register
		</h1>

		<p class="auth-description">
			Create an account to start playing.
		</p>


		<form id="register-form">

			<div class="auth-form-group">

				<label for="username">
					Username
				</label>

				<input type="text" id="username" name="username" required autocomplete="username"
					placeholder="Choose a username">

			</div>


			<div class="auth-form-group">

				<label for="password">
					Password
				</label>

				<input type="password" id="password" name="password" required autocomplete="new-password"
					placeholder="Choose a password">

			</div>


			<button type="submit" class="auth-submit-button">

				Register

			</button>


			<p id="register-message" class="auth-message" aria-live="polite">
			</p>

		</form>


		<p class="auth-switch">

			Already have an account?

			<a href="login.html">
				Login
			</a>

		</p>

	</main>


	<script src="../js/register.js"></script>

</body>

</html>
