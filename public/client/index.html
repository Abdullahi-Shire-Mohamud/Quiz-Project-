<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizHub</title>

    <link rel="stylesheet" href="../css/style.css">

    <!-- Test fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <nav class="navbar" aria-label="Main navigation">

            <a class="logo" href="index.html">
                QuizHub
            </a>

            <ul class="nav-links">
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="results.html">My Results</a>
                </li>

                <li id="admin-nav-item" hidden>
                    <a href="admin.html">Admin Dashboard</a>
                </li>
            </ul>

            <div class="nav-auth">
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>

        </nav>
    </header>


    <main class="home-page">

        <section class="hero-section">
            <p class="hero-label">Test your knowledge ✨</p>

            <h1>Available Quizzes</h1>

            <p class="hero-description">
                Choose a quiz and challenge yourself!
            </p>
        </section>

            <section class="browse-section" aria-labelledby="browse-title">

                <div class="section-heading">
                    <h2 id="browse-title">Browse Quizzes</h2>

                    <p>
                        Explore the quizzes currently available.
                    </p>
                </div>

                <div class="search-container">

                    <label for="quiz-search">
                        Search quizzes
                    </label>

                    <input type="search" id="quiz-search" placeholder="Search by quiz name..." autocomplete="off">

                    <p id="search-status" aria-live="polite"></p>

                </div>

                <div id="quiz-list" class="quiz-grid" aria-live="polite">
                    <!-- Quiz cards will later be created here with JavaScript -->
                </div>

        </section>

    </main>


    <script src="../js/start.js"></script>
    <script src="../js/quizzes.js"></script>

</body>

</html>
