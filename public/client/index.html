<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizHub</title>

    <<link rel="stylesheet" href="../css/style.css">>

    <!-- App fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <nav class="navbar" aria-label="Main navigation">

            <a class="logo" href="index.html">
                QuizHub
            </a>

            <ul class="nav-links">

                <li id="home-nav-item" hidden>
                    <a href="index.html">Home</a>
                </li>

                <li id="results-nav-item" hidden>
                    <a href="results.html">My Results</a>
                </li>

                <!-- Only visible for admin users -->
                <li id="admin-nav-item" hidden>
                    <a href="admin.html">Admin Dashboard</a>
                </li>
            </ul>

            <!-- Only visible when a user is logged in -->
            <div class="nav-user" id="user-nav" hidden>
                <button id="logout-button" type="button">
                    Logout
                </button>
            </div>

        </nav>
    </header>


    <main class="home-page">
        <!--
        This section is shown when the visitor is NOT logged in.
        The quiz content stays hidden until login.
    -->
        <section id="login-required" class="login-required" hidden>

            <h1>Welcome to QuizHub 👋</h1>

            <p>
                Please log in or create an account to view and play quizzes.
            </p>

            <!-- Login and Register options for visitors -->
            <div class="guest-actions" id="guest-nav">

                <a class="login-button" href="login.html">
                    Login
                </a>

                <a class="register-button" href="register.html">
                    Register
                </a>

            </div>

        </section>
        <!--
        Main quiz content.
        Hidden by default and shown by app.js
        after a logged-in user is found.
    -->
        <div id="quiz-content" hidden>

            <section class="hero-section">
                <p class="hero-label">
                    Test your knowledge,
                    <span id="usernameDisplay"></span> ✨
                </p>

                <h1>Available Quizzes</h1>

                <p class="hero-description">
                    Choose a quiz and challenge yourself!
                </p>
            </section>

            <section class="browse-section" aria-labelledby="browse-title">

                <div class="section-heading">
                    <h2 id="browse-title">Browse Quizzes</h2>

                    <p>
                        Explore the quizzes currently available.
                    </p>
                </div>

                <div class="search-container">

                    <label for="quiz-search">
                        Search quizzes
                    </label>

                    <input type="search" id="quiz-search" placeholder="Search by quiz name..." autocomplete="off">
                    <!--
                    JavaScript can update this text when
                    the user searches for something.
                -->
                    <p id="search-status" aria-live="polite"></p>

                </div>
                <!-- Filter quizzes by category and difficulty -->
                <div class="filter-container">

                    <!-- Category filter -->
                    <div class="filter-group">
                        <label for="category-filter">
                            Category
                        </label>

                        <select id="category-filter">
                            <option value="all">All categories</option>
                            <option value="HTML">HTML</option>
                            <option value="CSS">CSS</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="Backend">Backend</option>
                        </select>
                    </div>


                    <!-- Difficulty filter -->
                    <div class="filter-group">
                        <label for="difficulty-filter">
                            Difficulty
                        </label>

                        <select id="difficulty-filter">
                            <option value="all">All difficulties</option>
                            <option value="Easy">Easy</option>
                            <option value="Medium">Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>


                    <!-- Sort quizzes -->
                    <div class="filter-group">
                        <label for="sort-filter">
                            Sort by
                        </label>

                        <select id="sort-filter">
                            <option value="default">Default</option>
                            <option value="name-asc">Name A-Z</option>
                            <option value="name-desc">Name Z-A</option>
                            <option value="difficulty-asc">
                                Difficulty: Easy to Hard
                            </option>
                            <option value="difficulty-desc">
                                Difficulty: Hard to Easy
                            </option>
                        </select>
                    </div>

                </div>
                <div id="quiz-list" class="quiz-grid" aria-live="polite">
                    <!-- Quiz cards will later be created here with JavaScript -->
                </div>

            </section>
        </div>

    </main>


    <script src="../js/app.js"></script>
    <script src="../js/quizzes.js"></script>

</body>

</html>
