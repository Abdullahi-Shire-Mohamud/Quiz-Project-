<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Quiz | QuizHub</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>


<body>


    <nav class="navbar">

        <a href="index.html" class="logo">
            QuizHub
        </a>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="results.html">
                    My Results
                </a>
            </li>

            <li>
                <a href="admin.html">
                    Admin
                </a>
            </li>

        </ul>

    </nav>



    <main class="admin-quiz-page">


        <section class="admin-quiz-header">

            <div>

                <p class="admin-label">
                    Admin
                </p>

                <h1>
                    Create or Edit Quiz
                </h1>

                <p class="admin-description">
                    Enter the quiz information and questions below.
                </p>

            </div>


            <a href="admin.html" class="admin-back-button">
                Back to Dashboard
            </a>

        </section>



        <section class="admin-quiz-form">


            <!-- Quiz information -->

            <div class="quiz-information">

                <h2>
                    Quiz Information
                </h2>


                <div class="admin-form-group">

                    <label for="quiz-title">
                        Quiz Title
                    </label>

                    <input type="text" id="quiz-title" placeholder="Example: HTML Basics">

                </div>


                <div class="admin-form-group">

                    <label for="quiz-category">
                        Category
                    </label>

                    <input type="text" id="quiz-category" placeholder="Example: HTML">

                </div>


                <div class="admin-form-group">

                    <label for="quiz-difficulty">
                        Difficulty
                    </label>

                    <select id="quiz-difficulty">

                        <option value="">
                            Select difficulty
                        </option>

                        <option value="Easy">
                            Easy
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="Hard">
                            Hard
                        </option>

                    </select>

                </div>

            </div>


            <!-- Questions -->

            <section class="questions-section">

                <div class="questions-heading">

                    <h2>
                        Questions
                    </h2>

                    <button type="button" id="add-question-button">

                        Add Question

                    </button>

                </div>


                <div id="questions-container">
                    <!-- Question blocks are created with admin.js -->
                </div>

            </section>


            <!-- Form message -->

            <p id="message"></p>

            <!-- Form actions -->

            <div class="admin-form-actions">

                <a href="admin.html" class="admin-back-button">
                    Cancel
                </a>

                <button type="button" id="submit-button">
                    Save Quiz
                </button>

            </div>


        </section>

    </main>

    <script src="../js/admin.js"></script>


</body>

</html>
