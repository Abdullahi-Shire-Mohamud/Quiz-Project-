<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Results | QuizHub</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="results-page">

        <!-- Shown directly after completing a quiz -->
        <section class="result-card" id="single-result">

            <p class="result-label">
                Quiz completed ✨
            </p>

            <h1 id="result-title">
                Loading result...
            </h1>

            <p id="result-score"></p>

            <p id="result-message"></p>

            <div class="result-actions">

                <a href="index.html" class="result-home-button">
                    Back to Quizzes
                </a>

            </div>

        </section>


        <!-- Shown when user opens My Results -->
        <section class="results-history" id="results-history" hidden>

            <h1>My Results</h1>

            <p id="history-status">
                Loading your results...
            </p>

            <div id="history">
                <!-- Attempts are created dynamically in results.js -->
            </div>

            <div class="result-actions">

                <a href="index.html" class="result-home-button">
                    Back to Quizzes
                </a>

            </div>

        </section>

    </main>


    <script src="../js/results.js"></script>

</body>

</html>
