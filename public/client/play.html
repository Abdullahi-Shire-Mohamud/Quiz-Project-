<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Play Quiz | QuizHub</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="play-page">

        <section class="quiz-play-card">

            <!-- Current quiz question -->
            <h1 id="question">
                Loading question...
            </h1>


            <!-- Answer buttons -->
            <div class="answer-grid">

                <button type="button" class="answer-button">
                    Answer A
                </button>

                <button type="button" class="answer-button">
                    Answer B
                </button>

                <button type="button" class="answer-button">
                    Answer C
                </button>

                <button type="button" class="answer-button">
                    Answer D
                </button>

            </div>

        </section>

    </main>


    <!-- Handles quiz questions and scoring -->
    <script src="../js/play.js"></script>

</body>

</html>
